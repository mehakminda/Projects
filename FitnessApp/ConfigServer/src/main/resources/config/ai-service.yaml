spring:
    data:
        mongodb:
            uri: mongodb://localhost:27017/fitness_activity_db
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest


server:
    port: 8083

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true

RabbitMq:
    exchange:
        name: fitness.exchange
    queue:
        name: activity.queue
    routing:
        key: activity.tracking

gemini:
    api:
        url: ${GEMINI_URL}
        key: ${GEMINI_KEY}